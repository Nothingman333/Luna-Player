name: CI

# Every push and pull request is built and tested: the interface (TypeScript, the Vite build, every
# text has English) and the Rust side (compiles, unit tests). A release only goes out when this is green.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    name: Interface (tsc, build, texts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Type check and build
        working-directory: app
        run: npm run build
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Every text has English
        run: node app/scripts/i18n-check.cjs
      - name: Application regressions (single entry point)
        working-directory: app
        run: npm test

  rust:
    name: Rust (build, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      # the Tauri build checks that the bundled files exist (mpv, yt-dlp are not in git)
      - name: Fetch mpv and yt-dlp
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-mpv.ps1
      # the Rust side embeds the built interface
      - name: Build the interface
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Unit tests
        working-directory: app/src-tauri
        run: cargo test --lib
      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --locked --lib --tests

  audit:
    name: Rust dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: clippy
      - name: Install advisory checker
        run: cargo install cargo-audit --locked
      - name: Audit locked dependencies
        working-directory: app/src-tauri
        run: cargo audit
