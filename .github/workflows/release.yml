name: Release

# Manual builds only. Optional publication creates a draft for human review.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (for example 1.6.1)"
        required: true
        type: string
      publish:
        description: "Create a draft GitHub release after a successful signed build"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows setup and portable
    runs-on: windows-latest
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Set and validate the release version
        shell: pwsh
        run: |
          node scripts/release-version.cjs "$env:REQUESTED_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Invalid release version" }
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Fetch mpv, yt-dlp and license texts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-mpv.ps1

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Check interface and release inputs
        shell: pwsh
        run: |
          node scripts/release-version.cjs --check "$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Version mismatch" }
          node app/scripts/i18n-check.cjs
          if ($LASTEXITCODE -ne 0) { throw "Translation check failed" }

      - name: Build the signed NSIS installer and updater manifest
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-release.ps1 -Tag "v$env:VERSION" -RequireUpdater

      - name: Build the portable zip
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Version "$env:VERSION"

      - name: Stage and verify updater files and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = 'app/src-tauri/target/release/bundle/nsis'
          $name = "Luna Player_$($env:VERSION)_x64-setup.exe"
          $asset = $name.Replace(' ', '.')
          $manifest = Get-Content "$nsis/latest.json" -Raw | ConvertFrom-Json
          if ($manifest.version -cne $env:VERSION) { throw 'Updater version mismatch' }
          if ($manifest.platforms.'windows-x86_64'.url -cne "https://github.com/Nothingman333/Luna-Player/releases/download/v$($env:VERSION)/$asset") { throw 'Updater URL mismatch' }
          $signature = (Get-Content "$nsis/$name.sig" -Raw).Trim()
          if (-not $signature -or $manifest.platforms.'windows-x86_64'.signature -cne $signature) { throw 'Updater signature mismatch' }
          Copy-Item "$nsis/$name" "dist-share/$asset"
          Copy-Item "$nsis/$name.sig" "dist-share/$asset.sig"
          Copy-Item "$nsis/latest.json" 'dist-share/latest.json'
          $files = Get-ChildItem dist-share -File | Where-Object Name -ne 'SHA256SUMS.txt'
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllLines("$PWD/dist-share/SHA256SUMS.txt", $lines, [Text.UTF8Encoding]::new($false))

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Player-${{ env.VERSION }}
          if-no-files-found: error
          path: |
            dist-share/*

      - name: Publish the GitHub release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          files: |
            dist-share/*
