name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (for example 0.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows setup and portable
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Fetch mpv, yt-dlp and license texts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-mpv.ps1

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build the NSIS installer
        working-directory: app
        run: npm run tauri build

      - name: Build the portable zip
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Version "$env:VERSION"

      - name: Write checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe) + @(Get-ChildItem dist-share/*-portable.zip)
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content dist-share/SHA256SUMS.txt -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Player-${{ env.VERSION }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            dist-share/*_x64-portable.zip
            dist-share/SHA256SUMS.txt

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            dist-share/*_x64-portable.zip
            dist-share/SHA256SUMS.txt
