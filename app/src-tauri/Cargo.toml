[package]
name = "app"
version = "0.1.0"
description = "Luna Player"
authors = ["you"]
edition = "2024"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
trash = "5"
librqbit-dualstack-sockets = "0.7"
ttf-parser = "0.25"
zip = { version = "2", default-features = false, features = ["deflate"] }
librqbit = { version = "9", default-features = false, features = ["http-api", "rust-tls", "tracing-subscriber-utils"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "cookies"] }
serde_yaml = "0.9"
scraper = "0.20"
regex = "1"
urlencoding = "2"
flate2 = "1"
png = "0.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
