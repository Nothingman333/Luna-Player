[package]
name = "app"
version = "3.5.4"
description = "Luna Player"
authors = ["you"]
edition = "2024"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lofty = "0.22"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
alass-core = "2.0.0"
rmcp = { version = "3.6.0", default-features = false, features = ["client", "transport-child-process"] }
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
tauri = { version = "2", features = ["protocol-asset", "unstable", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
trash = "5"
librqbit-dualstack-sockets = "0.7"
ttf-parser = "0.25"
zip = { version = "9", default-features = false, features = ["deflate"] }
librqbit = { version = "9", default-features = false, features = ["http-api", "rust-tls", "tracing-subscriber-utils"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "gzip", "brotli", "cookies"] }
serde_yaml = "0.9"
scraper = "0.20"
ego-tree = "0.6"
regex = "1"
urlencoding = "2"
url = "2"
flate2 = "1"
png = "0.17"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sha2 = "0.10"
md-5 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ring = "0.17"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-updater = "2"
rusty-chromaprint = "0.3.0"
libloading = "0.8"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
souvlaki = { version = "0.8.3", default-features = false }
windows-core = "0.62"
windows = { version = "0.62.2", features = ["Globalization", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Win32_System_WinRT", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

# Development builds keep only line tables for debugging: full debug info made target/debug/incremental grow to
# 150+ GB across rebuilds. Release builds are unaffected.
[profile.dev]
debug = "line-tables-only"
